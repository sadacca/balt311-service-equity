name: "Cross-city: tract income equity score (feeds: Compare cities → Service Equity)"

# Feeds: Compare cities → Service Equity tab (peer_city_tract_income.parquet,
#   peer_city_equity.parquet — the mix-adjusted income equity score).
# Requires: peer_city_sequential.yml or peer_city_parallel.yml must have already populated
#   peer_city_tract_srtype_metrics.parquet / peer_city_tract_metrics.parquet for the requested
#   cities — the equity-score step below joins against those files and no-ops per city if
#   they're missing (silent partial result, not a hard failure), so the "Verify prerequisite
#   data" step catches a totally-missing prerequisite early instead of producing an empty score.
#
# Serialize against the other cross-city data writers so concurrent runs never race on a
# shared file (this writes its own peer_city_tract_income.parquet, but queue anyway for
# a predictable commit history on the data branch).
concurrency:
  group: peer-city-data
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      cities:
        description: "Comma-separated city slugs (e.g. 'baltimore,dc')"
        required: false
        default: "baltimore,dc,philadelphia,nyc,chicago,sf,austin,nashville,kansas_city,boston,memphis,cincinnati,seattle,dallas,los_angeles"
        type: string
      force:
        description: "Refetch cities even if already present"
        required: false
        default: false
        type: boolean

jobs:
  peer_city_equity:
    name: "Cross-city tract income — ${{ inputs.cities }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pandas pyarrow

      - name: Verify prerequisite cross-city delivery metrics exist
        run: |
          if [ ! -f data/processed/peer_city_tract_srtype_metrics.parquet ] || [ ! -f data/processed/peer_city_tract_metrics.parquet ]; then
            echo "ERROR: peer_city_tract_srtype_metrics.parquet / peer_city_tract_metrics.parquet not found."
            echo "Run peer_city_sequential.yml or peer_city_parallel.yml first to populate them."
            exit 1
          fi
          echo "Prerequisite delivery-metrics files found."

      - name: Fetch per-city tract median income
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          FLAGS=""
          [ "${{ inputs.force }}" = "true" ] && FLAGS="$FLAGS --force"
          python scripts/peer_city_equity.py --cities "${{ inputs.cities }}" $FLAGS

      - name: Compute per-city mix-adjusted income equity score
        run: |
          # Pure local computation over already-committed tract×SRType / tract / income
          # parquet files (Phase 5.5-2 outputs) — no-ops gracefully if those inputs don't
          # exist yet for a city (e.g. peer_city.py hasn't been run for it).
          python scripts/peer_city_equity_score.py --cities "${{ inputs.cities }}"

      - name: Commit and push cross-city equity data
        if: always()  # persist cities that succeeded even if another city's fetch failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/peer_city_tract_income.parquet
          [ -f data/processed/peer_city_equity.parquet ] && git add data/processed/peer_city_equity.parquet || true
          if git diff --staged --quiet; then
            echo "Cross-city equity data unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "peer: per-city tract median income + income equity score for ${{ inputs.cities }} (Phase 5.5-1/5.5-3)"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Pushed on attempt $attempt"; exit 0
            fi
            echo "Push attempt $attempt failed — retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "ERROR: could not push after retries"; exit 1
