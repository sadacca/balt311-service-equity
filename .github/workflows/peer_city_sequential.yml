name: "Cross-city: delivery metrics — sequential, smart-skip (feeds: Compare cities → Service Delivery)"

# Replaces peer_city.yml (single year) and peer_city_backfill.yml (multi-year) — both called
# scripts/peer_city.py the same way, one job, cities handled inside the script; a single year
# is just a backfill of length one. This workflow takes a space-separated `years` list (default
# one year) and loops, so it covers both old use cases with one code path.
#
# Honors peer_city.py's smart reuse — without --force, (city, year) rows already present are
# skipped, so this is safe to re-run to "fill in whatever's missing." Use peer_city_parallel.yml
# instead when you want every city fetched concurrently (faster, but always force-refetches).
#
# Feeds: Compare cities → Service Delivery tab (peer_city_metrics.parquet), plus the
#   tract×SRType/tract grains that peer_city_equity.yml needs for the Service Equity tab.
# Requires: nothing to run — but peer_city_equity.yml (Service Equity tab) requires THIS
#   (or peer_city_parallel.yml) to have populated tract_srtype/tract metrics first.

# Serialize all cross-city data writers (this + the parallel workflow) so two runs never race
# on the binary peer_city_metrics.parquet. Queue rather than cancel.
concurrency:
  group: peer-city-data
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      years:
        description: "Space-separated years to process, oldest first (one year = single-year run)"
        required: true
        default: "2024"
        type: string
      cities:
        description: "Comma-separated city slugs (e.g. 'baltimore,dc')"
        required: false
        default: "baltimore,dc,philadelphia,nyc,chicago,sf,austin,nashville,kansas_city,boston,memphis,cincinnati,seattle,dallas,los_angeles"
        type: string
      is_live_year:
        description: "Treat the LAST year in the list as live? (applies 30-day right-censoring)"
        required: false
        default: false
        type: boolean
      force:
        description: "Refetch cities even if their (city, year) row already exists"
        required: false
        default: false
        type: boolean
      pause_seconds:
        description: "Pause between years (seconds) — courtesy delay for the portals; ignored for a single year"
        required: false
        default: "120"
        type: string

jobs:
  peer_city:
    name: "Years: ${{ inputs.years }} — Cities: ${{ inputs.cities }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pandas pyarrow geopandas

      - name: Process years sequentially
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
          SOCRATA_KEY_ID: ${{ secrets.SOCRATA_KEY_ID }}
          SOCRATA_KEY_SECRET: ${{ secrets.SOCRATA_KEY_SECRET }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          years=(${{ inputs.years }})
          last_index=$((${#years[@]} - 1))
          first=true
          for i in "${!years[@]}"; do
            year="${years[$i]}"

            if [ "$first" = "false" ]; then
              echo "--- Pausing ${{ inputs.pause_seconds }}s before $year ---"
              sleep ${{ inputs.pause_seconds }}
            fi
            first=false

            echo "=============================="
            echo "  Year: $year"
            echo "=============================="

            FLAGS=""
            if [ "${{ inputs.is_live_year }}" = "true" ] && [ "$i" = "$last_index" ]; then
              FLAGS="$FLAGS --live"
            fi
            [ "${{ inputs.force }}" = "true" ] && FLAGS="$FLAGS --force"

            # peer_city.py isolates each city and writes whatever succeeded; a non-zero
            # exit means some city failed that year. Capture it but still commit + continue,
            # so one bad portal/year doesn't abort the rest of the run.
            rc=0
            python scripts/peer_city.py --year "$year" --cities "${{ inputs.cities }}" $FLAGS || rc=$?

            git pull --rebase --autostash origin main
            git add data/processed/peer_city_metrics.parquet data/processed/peer_city_meta.csv
            [ -f data/processed/peer_city_tract_srtype_metrics.parquet ] && git add data/processed/peer_city_tract_srtype_metrics.parquet || true
            [ -f data/processed/peer_city_tract_metrics.parquet ] && git add data/processed/peer_city_tract_metrics.parquet || true
            if git diff --staged --quiet; then
              echo "No cross-city changes for $year"
            else
              git commit -m "peer: cross-city 311 metrics for ${{ inputs.cities }} ($year)"
              for attempt in 1 2 3 4 5; do
                if git pull --rebase --autostash origin main && git push origin main; then
                  echo "Pushed $year on attempt $attempt"; break
                fi
                echo "Push attempt $attempt for $year failed — retrying in $((attempt * 5))s"
                sleep $((attempt * 5))
              done
            fi

            if [ "$rc" != "0" ]; then
              echo "WARNING: year $year had city failures (rc=$rc) — continuing to next year"
            fi
          done
