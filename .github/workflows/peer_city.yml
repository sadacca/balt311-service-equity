name: Cross-city 311 metrics (Phase 5)

# Serialize all cross-city data writers (this + the backfill) so two runs never race on
# the binary peer_city_metrics.parquet. Queue rather than cancel.
concurrency:
  group: peer-city-data
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year to process (must be a shared year across the cities)"
        required: true
        default: "2024"
        type: string
      cities:
        description: "Comma-separated city slugs (e.g. 'baltimore,dc')"
        required: false
        default: "baltimore,dc,philadelphia,nyc,chicago,sf,austin,nashville,kansas_city,boston"
        type: string
      is_live_year:
        description: "Live current-year file? (applies 30-day right-censoring)"
        required: false
        default: false
        type: boolean
      force:
        description: "Refetch cities even if their (city, year) row already exists"
        required: false
        default: false
        type: boolean

jobs:
  peer_city:
    name: "Cross-city metrics — ${{ inputs.cities }} (${{ inputs.year }})"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pandas pyarrow

      - name: Fetch + compute cross-city metrics
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          FLAGS=""
          [ "${{ inputs.is_live_year }}" = "true" ] && FLAGS="$FLAGS --live"
          [ "${{ inputs.force }}" = "true" ] && FLAGS="$FLAGS --force"
          python scripts/peer_city.py --year ${{ inputs.year }} --cities "${{ inputs.cities }}" $FLAGS

      - name: Commit and push cross-city outputs
        if: always()  # persist cities that succeeded even if another city's fetch failed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/peer_city_metrics.parquet data/processed/peer_city_meta.csv
          if git diff --staged --quiet; then
            echo "Cross-city data unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "peer: cross-city 311 metrics for ${{ inputs.cities }} (${{ inputs.year }})"
          # Rebase onto any concurrent commits (other workflows touch different files) and
          # retry, so a ref race ('fetch first' rejection) doesn't fail the run.
          for attempt in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin main; then
              echo "Pushed on attempt $attempt"; exit 0
            fi
            echo "Push attempt $attempt failed — retrying in $((attempt * 5))s"
            sleep $((attempt * 5))
          done
          echo "ERROR: could not push after retries"; exit 1
