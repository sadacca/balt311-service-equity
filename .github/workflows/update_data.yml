name: Update 311 processed data

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year to process"
        required: true
        default: "2025"
        type: choice
        options:
          - "2025"
          - "2024"
          - "2023"
          - "2022"
          - "2021"
          - "2020"
          - "2019"
          - "2018"
          - "2017"
          - "2016"
          - "2026"
      is_live_year:
        description: "Live current-year file? (applies 30-day right-censoring)"
        required: false
        default: false
        type: boolean

jobs:
  # ── Job 0: ACS demographic reference files (year-independent) ───────────────
  # Fetches ACS 2023 5-year demographics (race, income, age, ethnicity,
  # education, poverty) and commits tract_demographics.csv + csa_demographics.csv
  # to data/processed/. Always runs — use regen_demographics.yml when you need to
  # force-regenerate files that already exist (e.g. after adding new ACS variables).
  demographics:
    name: "Demographics — ACS reference files"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Skip if demographic files already committed
        id: check
        run: |
          if [ -f data/processed/tract_demographics.csv ] && [ -f data/processed/csa_demographics.csv ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Demographic files already present — use regen_demographics.yml to force-regenerate."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip == 'false'
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        if: steps.check.outputs.skip == 'false'
        run: pip install pandas pyarrow

      - name: Fetch ACS demographics
        if: steps.check.outputs.skip == 'false'
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: python scripts/pipeline.py --stage demographics

      - name: Commit demographic files
        if: steps.check.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/tract_demographics.csv data/processed/csa_demographics.csv
          if git diff --staged --quiet; then
            echo "No demographic files to commit."
          else
            git commit -m "pipeline: add ACS demographic reference files"
            git push origin main
          fi

  # ── Job 1: Fetch raw 311 data from ArcGIS ──────────────────────────────────
  # Only needs pandas + pyarrow. Uploads raw Parquet as a workflow artifact
  # so the process job can be re-run independently without re-fetching.
  ingest:
    name: "Stage 1 — Fetch raw data (${{ inputs.year }})"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pandas pyarrow

      - name: Fetch raw 311 records
        run: python scripts/pipeline.py --year ${{ inputs.year }} --stage ingest

      - name: Upload raw Parquet as artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-311-${{ inputs.year }}
          path: data/raw/requests_${{ inputs.year }}.parquet
          retention-days: 7

  # ── Job 2: Clean, aggregate, commit ────────────────────────────────────────
  # Downloads raw Parquet from Job 1, runs clean + spatial join + aggregate,
  # and pushes data/processed/ back to main.
  # Can be re-run independently if it fails (Actions UI → Re-run failed jobs).
  process:
    name: "Stages 2+3 — Clean, aggregate, commit (${{ inputs.year }})"
    needs: ingest
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pandas pyarrow geopandas

      - name: Download raw Parquet from ingest job
        uses: actions/download-artifact@v4
        with:
          name: raw-311-${{ inputs.year }}
          path: data/raw/

      - name: Clean, spatial join, aggregate
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
        run: |
          LIVE_FLAG=""
          [ "${{ inputs.is_live_year }}" = "true" ] && LIVE_FLAG="--live"
          python scripts/pipeline.py --year ${{ inputs.year }} --stage process $LIVE_FLAG

      - name: Generate SRType aggregate metrics
        run: python scripts/pipeline.py --year ${{ inputs.year }} --stage srtype

      - name: Generate mix-adjusted metrics
        run: |
          LIVE_FLAG=""
          [ "${{ inputs.is_live_year }}" = "true" ] && LIVE_FLAG="--live"
          python scripts/pipeline.py --year ${{ inputs.year }} --stage adjusted $LIVE_FLAG

      - name: Commit and push processed outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/
          if git diff --staged --quiet; then
            echo "Processed data unchanged — nothing to commit."
          else
            git commit -m "pipeline: update processed data for ${{ inputs.year }}"
            git push origin main
          fi
