# Canonical color/typography tokens live in app/components/theme.py; primaryColor mirrors
# theme.PRIMARY so Streamlit widget accents match the dashboard's dominant chart blue.
[theme]
primaryColor = "#1F4E8C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F6F9FC"
textColor = "#1A1A1A"
font = "sans serif"

[server]
headless = true

[browser]
gatherUsageStats = false
